version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: enterprise_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secure_root_password_here
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: secure_user_password_here
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  app:
    image: nextcloud:latest
    container_name: enterprise_nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD: secure_user_password_here
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - db
    networks:
      - backend
      - frontend

volumes:
  db_data:
  nextcloud_data:

networks:
  backend:
  frontend:
